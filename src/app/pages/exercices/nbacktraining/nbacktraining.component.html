<div id="pagesBackground">
    <div class="pagesTitle">
        <div>
            <div class="pageTitle">{{title}}</div>
            <p class="pageSubTitle">{{subTitle}}</p>
        </div>
        <img class="cta-slider-bloc-image cta-shadow" src="/assets/nbacktraining.png"/>
    </div>
</div>
 <div class="elementMenu">
    <div class="elementMenuContent">
        <div class="elementMenuContentElementsText">
            <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage" [innerHTML]="explaination"></p>
        </div>
    </div>
    <div #game class="container">
        <button [ngClass]="addButtonClass()" (click)="startGame()" [disabled]="start">Start</button>
        <p class="message" [innerHTML]="message"></p>
        <div *ngIf="typeLevel ==''" #insertremovelevel>
            <div class="level" id="levelGame">
                <button [ngClass]="start ? 'levelcolor':'levelcolor grey'" (click)="chooseLevel('levelcolor')">{{color}}</button>
                <button [ngClass]="start ? 'levelletters':'levelletters grey'" (click)="chooseLevel('levelletters')">{{letters}}</button>
            </div>
        </div>
        
        <div *ngIf="start && typeLevel!=''" class="progress">
            <div class="bar" [style.width.%]="progress"></div>
        </div>
        <div *ngIf="start && typeLevel!=''">
            <div class="grid" *ngIf="typeLevel === 'levelcolor'">
                <div 
                    *ngFor="let cell of grid; let i = index"
                    class="cell"
                    [class.active]="i === activeIndex"
                ></div>
            </div>
            <div class="grid" *ngIf="typeLevel === 'levelletters'">
                <div
                    *ngFor="let cell of grid; let i = index"
                    class="cell"
                    >
                    <div 
                        class="tile"
                        *ngIf="i === activeIndex"
                        [class.show]="showTile"
                    >
                        {{ currentLetter }}
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="start && typeLevel!=''" class="actions">
            <button (click)="answer(true)" class="match">{{match}}</button>
            <button (click)="answer(false)" class="no-match">{{nomatch}}</button>
        </div>
    </div>
     <div *ngIf="showScore" class="pageSubTitle bottomRightPage">Score : {{score}}/{{totalSteps}}</div>
</div>
