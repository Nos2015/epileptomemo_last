<div id="pagesBackground">
    <div class="pagesTitle">
        <div>
            <div class="pageTitle">{{title}}</div>
            <p class="pageSubTitle">{{subTitle}}</p>
        </div>
        <img class="cta-slider-bloc-image cta-shadow" src="/assets/patternbuilder.png"/>
    </div>
</div>
 <div class="elementMenu">
    <div class="elementMenuContent">
        <div class="elementMenuContentElementsText">
            <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage" [innerHTML]="explaination"></p>
        </div>
    </div>
    <div class="simon-container">
        <button [ngClass]="addButtonClass('button-width50')" (click)="startGame()" [disabled]="start">Start</button>
    <!-- SCORE -->
    <div class="top">
        <div class="level pageSubTitle">{{ levelText }} {{ level }}</div>
        <!-- MESSAGE -->
        <div class="message pageSubTitle">
            {{ message }}
        </div>
    </div>

    <!-- BOARD -->
    <div class="board">

        <div
        class="pad yellow"
        [ngClass]="{'grey': !start, 'yellow': start, 'active' : start && activePad==='yellow' }"
        (click)="handleClick('yellow')"
        ></div>
        <div 
        class="pad blue"
        [ngClass]="{'grey': !start, 'blue': start, 'active' : start && activePad==='blue' }"
        (click)="handleClick('blue')"
        ></div>

        <div 
        class="pad red"
        [ngClass]="{'grey': !start, 'red': start, 'active' : start && activePad==='red' }"
        (click)="handleClick('red')"
        ></div>

        <div 
        class="pad green"
        [ngClass]="{'grey': !start, 'green': start, 'active' : start && activePad==='green' }"
        (click)="handleClick('green')"
        ></div>

    </div>
</div>
 <div class="pageSubTitle bottomRightPage">Score : {{score}}</div>
