<div class="stat-card">

    <div class="icon">
        <img class="icon" src="../../../../assets/{{icon}}.png" [style.background-color]="color"/>
    </div>

    <div class="value">

        {{ value }}

    </div>

    <div class="label">

        {{ label }}

    </div>

    <div class="trend">

        {{ trend }}

    </div>

    <div class="trend-label">

        {{ trendLabel }}

    </div>

</div>
