<div class="card">
    <div class="header">
        <h2>{{automaticSummary}}</h2>
    </div>
    <div class="rows">
        <p class="rowsTitle">{{previousReport}}</p>
        @for(item of resumeToSee;track item){
            <div class="row">
                <div class="check">

                    ✔

                </div>
                <div class="info">{{item.info}}</div>
            </div>
        }
    </div>
</div>
