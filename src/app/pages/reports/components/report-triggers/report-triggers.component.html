<div class="card">
    <h2>{{mainTriggers}}</h2>
    <div class="trigger">
        <span>{{stress}}</span>
        <span>63%</span>
    </div>
    <div class="progress">
        <div style="width:63%; background:var(--em-stress);"></div>
    </div>
    <div class="trigger">
        <span>{{fatigue}}</span>
        <span>52%</span>
    </div>
    <div class="progress">
        <div style="width:52%; background:var(--em-fatigue);"></div>
    </div>
    <div class="trigger">
        <span>{{lackOfSleep}}</span>
        <span>48%</span>
    </div>
    <div class="progress">
        <div style="width:48%; background:var(--em-sleep);"></div>
    </div>
    <div class="trigger">
        <span>{{missedTreatment}}</span>
        <span>22%</span>
    </div>
    <div class="progress">
        <div style="width:22%; background:var(--em-treatment);"></div>
    </div>
</div>
