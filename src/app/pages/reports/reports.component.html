<div id="pagesBackground">
    <div class="pagesTitle">
        <div class="pageTitle">{{title}}</div>
        <div class="comingSoon">{{comingSoon}}</div>
    </div>
    <div class="elementMenu">
        <div class="elementMenuContent">
            <div class="elementMenuContentElementsText">
                <p class="title-cta-slider elementMenuContentText">{{titlePage}}</p>
                <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage">{{subtitle}}</p>
            </div>
        </div>
        <div class="elementMenuContent elementMenuContentAlign elementMenuContentAlignFlex">
            <div class="elementMenuContentElementsText elementMenuContentElementsTextFlex">
                <img class="cta-slider-bloc-image cta-shadow" src="/assets/check.png"/>
                <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage elementMenuContentTextUnderPageFlex">{{first}}</p>
            </div>
        </div>
        <div class="elementMenuContent elementMenuContentAlign elementMenuContentAlignFlex">
            <div class="elementMenuContentElementsText elementMenuContentElementsTextFlex">
                <img class="cta-slider-bloc-image cta-shadow" src="/assets/check.png"/>
                <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage elementMenuContentTextUnderPageFlex">{{second}}</p>
            </div>
        </div>
        <div class="elementMenuContent">
            <div class="elementMenuContentElementsText">
                <p class="title-cta-slider-under elementMenuContentTextUnder elementMenuContentTextUnderPage">{{conclusion}}</p>
            </div>
        </div>
        <div class="cta-pages">
            <img class="cta-slider-bloc-image cta-shadow cta-pages-img" src="/assets/background_items_pages.png"/>
            <img class="cta-slider-bloc-image cta-shadow cta-pages-img-right" src="/assets/neurorapports_icon.png"/>
        </div>
    </div>
</div>
