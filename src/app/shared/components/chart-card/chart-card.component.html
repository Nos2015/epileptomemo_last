<div class="chart-wrapper">
    <div class="chart-infos">
        <div class="chart-elements">
            <h2 class="chart-title">{{evolutionCrisis}}</h2>
            <div class="info-button">
                ⓘ
                <div class="tooltip">
                    {{evolutionCrisisToolTip}}
                </div>
            </div>
        </div>
        <div class="period-selector">
            <select id="period-select" [(ngModel)]="selectedPeriod">
                <option value="7">7 {{lastDays}}</option>
                <option value="30">30 {{lastDays}}</option>
                <option value="90">3 {{lastMonth}}</option>
                <option value="180">6 {{lastMonth}}</option>
                <option value="365">12 {{lastMonth}}</option>
            </select>
        </div>
    </div>
  <apx-chart
    [series]="chartOptions.series"
    [chart]="chartOptions.chart"
    [xaxis]="chartOptions.xaxis"
    [stroke]="chartOptions.stroke"
    [markers]="chartOptions.markers"
    [tooltip]="chartOptions.tooltip"
    [grid]="chartOptions.grid">
  </apx-chart>

</div>
