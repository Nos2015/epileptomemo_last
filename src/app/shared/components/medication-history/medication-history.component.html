<div class="card">
    <div class="header">
        <h2>{{latestInTake}}</h2>
        <a>{{seeEverything}}</a>
    </div>
    <div class="rows">
        @for(item of historyToSee;track item){
            <div class="row">
                <div>{{item.date}}</div>
                <div>{{item.name}}</div>
                <div>{{item.dose}}</div>
                <div class="check">

                    ✔

                </div>
            </div>
        }
    </div>
</div>
